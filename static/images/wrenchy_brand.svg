<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="wrenchChromeBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="wrenchEyeBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Legs -->
  <rect x="36" y="96" width="8" height="16" rx="4" fill="#475569" />
  <rect x="56" y="96" width="8" height="16" rx="4" fill="#475569" />
  <!-- Shoes -->
  <ellipse cx="38" cy="112" rx="7" ry="4" fill="#1e293b" />
  <ellipse cx="62" cy="112" rx="7" ry="4" fill="#1e293b" />

  <!-- Left Arm -->
  <path d="M 28 52 Q 14 58 12 70" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="12" cy="71" r="5" fill="#94a3b8" />

  <!-- Right Arm (Friendly Waving) -->
  <path d="M 72 52 Q 86 52 88 40" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none" />
  <circle cx="89" cy="38" r="5" fill="#94a3b8" />

  <!-- Wrench Head & Body -->
  <path d="M 32 18 C 32 6 42 2 50 2 C 58 2 68 6 68 18 C 68 25 64 30 60 33 L 60 92 C 60 96 55 98 50 98 C 45 98 40 96 40 92 L 40 33 C 36 30 32 25 32 18 Z"
        fill="url(#wrenchChromeBrand)" stroke="#334155" stroke-width="2.5" />
  
  <!-- Spanner Jaws cutout -->
  <path d="M 42 2 L 50 14 L 58 2 Z" fill="#0f172a" />

  <!-- Eyes -->
  <ellipse cx="44" cy="42" rx="4.5" ry="5.5" fill="#0f172a" />
  <ellipse cx="56" cy="42" rx="4.5" ry="5.5" fill="#0f172a" />
  <circle cx="45" cy="40.5" r="1.8" fill="url(#wrenchEyeBrand)" />
  <circle cx="57" cy="40.5" r="1.8" fill="url(#wrenchEyeBrand)" />
  <circle cx="43.5" cy="39.5" r="0.8" fill="#ffffff" />
  <circle cx="55.5" cy="39.5" r="0.8" fill="#ffffff" />

  <!-- Blushing Cheeks -->
  <ellipse cx="40" cy="48" rx="2.8" ry="1.6" fill="rgba(244, 63, 94, 0.65)" />
  <ellipse cx="60" cy="48" rx="2.8" ry="1.6" fill="rgba(244, 63, 94, 0.65)" />

  <!-- Smiling Mouth -->
  <path d="M 45 50 Q 50 56 55 50" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
